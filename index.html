<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudentAware: A central repository for tracking student contact and support.">
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>StudentAware</title>
</head>

<body class="bg-dark text-light">
    <header class="container-fluid">
        <nav class="navbar fixed-top navbar-dark">
            <div class="fluid-container header-container">
                <a class="navbar-brand" href="#">StudentAware</a>
            </div>

            <div class="fluid-container">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="students.html">Students</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container-fluid bg-secondary text-center">
        <div class="card rounded-3">
            <div class="card-header">
                <h1>Welcome to StudentAware!</h1>
            </div>
    
            <div class="card-body">
                <form method="get" action="courses.html">
                    <div class="input-group mb-3">
                        <span class="input-group-text">@</span>
                        <input class="form-control" type="email" placeholder="you@example.com" />
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">🔒</span>
                        <input class="form-control" type="password" placeholder="password" />
                    </div>
        
                    <button class="btn btn-primary" type="submit">Login</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark fixed-bottom text-white-50">
        <span class="text-reset">Collin Mickelson</span>
        <a class="text-reset" href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
