<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="tables.css">
    <link rel="stylesheet" href="student.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cosmo Cougar (CS 111)</title>
</head>

<body class="bg-dark text-light">
    <header class="container-fluid">
        <nav class="navbar fixed-top navbar-dark">
            <div class="fluid-container header-container">
                <a class="navbar-brand" href="index.html">StudentAware</a>
            </div>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="register.html">Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="students.html">Students</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container-fluid bg-secondary text-center">
        <div>
            <div class="card rounded-3">
                <div class="card-header">
                    <div class="table-header-container">
                        <img alt="profile picture for cosmo cougar" src="assets/male-profile.svg" />
                        <div class="table-header">
                            <h1>Cosmo Cougar</h1>
                            <div class="table-subtitle">
                                <h4>NetID: ccougar</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="table-title">
                        <h3>Contact Attempts</h3>
                    </div>
                        
                    <table class="table table-bordered md-0 mb-0 table-responsive table-light table-striped table-hover">
                        <thead>
                            <tr>
                                <th scope="col">Timestamp</th>
                                <th scope="col">Instructor</th>
                                <th scope="col">Method</th>
                                <th scope="col">Success</th>
                            </tr>
                        </thead>
            
                        <tbody class="table-group-divider">
                            <tr>
                                <th scope="row"><a class="text-reset" href="example-contact.html">9/15/2026 &commat; 5:34 PM</a></th>
                                <td>Shane Reese</td>
                                <td>Email</td>
                                <td class="contact-status"><input class="form-check-input" type="checkbox" aria-label="contact success" disabled checked/></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Reminders will be delivered using the Discord API -->
        
            <div class="card rounded-3 mt-3">
                <div class="card-header">
                    <div class="table-header-container">
                        <div class="table-header">
                            <h2>Reminders</h2>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="reminders-container">
                        <div class="table-title">
                            <h3>Pending Reminders</h3>
                        </div>
    
                        <div id="reminders-table">
                            <table class="table table-bordered md-0 mb-0 table-responsive table-light table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th scope="col">Timestamp</th>
                                    </tr>
                                </thead>
                
                                <tbody class="table-group-divider">
                                    <tr>
                                        <td>
                                            <div class="reminder">
                                                <span>9/26/2026 &commat; 1:00 PM</span>
                                                <button class="btn btn-danger btn-sm" type="button" id="delete" aria-label="delete reminder">Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
            
                        <form class="mt-3">
                            <div class="input-group">
                                <label class="input-group-text" for="timestamp">Date:</label>
                                <input class="form-control" type="datetime-local" id="timestamp" name="timestamp" />
                                <button type="submit" class="btn btn-success">Add Reminder</button>
                            </div>
                        </form>
                    </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50">
        <span class="text-reset">Collin Mickelson</span>
        <a class="text-reset" href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
