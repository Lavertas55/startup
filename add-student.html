<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="add-student.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Add Student</title>
</head>

<body class="bg-dark text-light">
    <header class="container-fluid">
        <nav class="navbar fixed-top navbar-dark">
            <div class="fluid-container header-container">
                <a class="navbar-brand" href="index.html">StudentAware</a>
            </div>

            <div class="fluid-container">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="students.html">Students</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container-fluid bg-secondary text-center">
        <div>
            <!-- Normally this form would take you back to the previous page. -->
            <div class="card rounded-3">
                <div class="card-header">
                    <h1>Add Student</h1>
                </div>
                <div class="cardbody p-3">
                    <div id="addStudentForm">
                        <form method="get" action="students.html">
                            <div class="row g-3">
                                <div class="col-12 col-sm-6 col-md-4 input-group">
                                    <label class="input-group-text" for="netid">Net ID:</label>
                                    <input class="form-control" type="text" id="netid" name="netid" />
                                </div>
                
                                <div class="col-12 col-sm-6 col-md-4 input-group">
                                    <label class="input-group-text" for="name">Name:</label>
                                    <input class="form-control" type="text" id="name" name="name" />
                                </div>  
                            </div>
                            
                            <div class="row g-3">
                                <div class="col-12 col-sm-6 col-md-4 input-group">
                                    <label for="inputClass" class="input-group-text">Class</label>
                                    <select id="inputClass" class="form-select">
                                    <option selected>Choose...</option>
                                    <option>CS 111: Introduction to Computer Science</option>
                                    </select>
                                </div>
                    
                                <div class="col-12 col-sm-6 col-md-4 input-group">
                                    <label for="profile-pic" class="input-group-text">Picture:</label>
                                    <input class="form-control" type="file" id="profile-pic" name="profile-pic" accept=".jpg,.png" />
                                </div>
                            </div>
                
                            <br>
                
                            <button class="btn btn-success" type="submit">Add</button>
                            <button class="btn btn-danger" type="button" onclick="location.href='students.html'">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50">
        <span class="text-reset">Collin Mickelson</span>
        <a class="text-reset" href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
