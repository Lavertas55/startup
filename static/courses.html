<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
</head>

<body>
    <header>
        <h1>StudentAware</h1>

        <nav>
            <menu>
                <li><a href="../index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="students.html">Students</a></li>
            </menu>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Courses</h2>

        <section>
            <button type="button">Add Course</button>

            <div id="courses-table">
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Code</th>
                        <th>&num; Students</th>
                    </tr>
                    <tr>
                        <td><a href="example-course.html">Introduction to Computer Science</a></td>
                        <td>CS 111</td>
                        <td>100</td>
                    </tr>
                </table>
            </div>

            <!-- Normally the form will be hidden until the user clicks the add course button -->

            <form id="add-course">
                <label for="name">
                    Name:
                    <input type="text" id="name" name="name" />
                </label>

                <br>

                <label for="code">
                    Code:
                    <input type="text" id="code" name="code" />
                </label>

                <br>

                <button type="submit">Add</button>
                <button type="button" id="cancel-add">Cancel</button>
            </form>
        </section>

        <hr>
    </main>

    <footer>
        <span>Collin Mickelson</span>
        <br>
        <a href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
