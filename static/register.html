<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>
    <header>
        <h1>StudentAware</h1>

        <nav>
            <menu>
                <li><a href="../index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="students.html">Students</a></li>
            </menu>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Register</h2>

        <form method="get" action="courses.html">
            <div>
                <label for="email-input">Email:</label>
                <input type="email" id="email-input" name="email" placeholder="you@example.com" />
            </div>
            <div>
                <label for="password-input">Password:</label>
                <input type="password" id="password-input" name="password" placeholder="password" />
            </div>
            <div>
                <label for="password-confirm">Confirm Password:</label>
                <input type="password" id="password-confirm" name="password-confirm" placeholder="re-enter password" />
            </div>

            <button type="submit">Register</button>
        </form>

        <hr>
    </main>

    <footer>
        <span>Collin Mickelson</span>

        <a href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
