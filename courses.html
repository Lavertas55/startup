<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="tables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Courses</title>
</head>

<body class="bg-dark text-light">
    <header class="container-fluid">
        <nav class="navbar fixed-top navbar-dark">
            <div class="fluid-container header-container">
                <a class="navbar-brand" href="index.html">StudentAware</a>
            </div>

            <div class="fluid-container">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="courses.html">Courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="students.html">Students</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container-fluid bg-secondary text-center">
        <div>
            
            <section>
                
                <div class="card rounded-3 mb-3" id="courses-table">
                    <div class="card-header">
                        <div class="table-title-container">
                            <div class="table-title mb-2">
                                <h1>Courses</h1>
                            </div>
                            
                            <button class="btn btn-primary" type="button" id="add-course-btn">Add Course</button>
                        </div>
                    </div>

                    <div class="card-body">
                        <table class="table table-bordered md-0 mb-0 table-responsive table-light table-striped table-hover">
                            <thead>
                                <tr>
                                    <th scope="col">Code</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">&num; Students</th>
                                </tr>
                            </thead>
        
                            <tbody class="table-group-divider">
                                <tr>
                                    <th scope="row">CS 111</th>
                                    <td><a class="text-reset" href="example-course.html">Introduction to Computer Science</a></td>
                                    <td>100</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
    
                <!-- Normally the form will be hidden until the user clicks the add course button -->
    
                <div class="card rounded-3">
                    <div class="card-header">
                        <h2>Add Course</h2>
                    </div>

                    <div class="card-body">
                        <form id="add-course">                    
                            <div class="input-group mb-3">
                                <label class="input-group-text" for="class-code">Class Code:</label>
                                <input class="form-control" type="text" id="class-code" name="class-code" />
                            </div>
        
                            <div class="input-group mb-3">
                                <label class="input-group-text" for="name">Name:</label>
                                <input class="form-control" type="text" id="name" name="name" />
                            </div>
                
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button class="btn btn-success" type="submit">Add</button>
                                <button class="btn btn-danger" type="button" id="cancel-add">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-dark fixed-bottom text-white-50">
        <span class="text-reset">Collin Mickelson</span>
        <a class="text-reset" href="https://github.com/lavertas55/startup">GitHub</a>
    </footer>
</body>

</html>
